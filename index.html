<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TacOps</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>TacOps</h1>
      <p>Reads your local Tacticus credentials, fetches your live account data, and shows your current expeditions board.</p>

      <button id="go-button" type="button">GO</button>
      <p id="status-msg"></p>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="operations">Operations</button>
        <button class="tab-btn" data-tab="characters">Characters</button>
        <button class="tab-btn" data-tab="mows">Machines of War</button>
      </nav>

      <div id="tab-operations" class="tab-panel">
        <div id="board-output"></div>
      </div>
      <div id="tab-characters" class="tab-panel hidden">
        <div id="characters-output"></div>
      </div>
      <div id="tab-mows" class="tab-panel hidden">
        <div id="mow-output"></div>
      </div>
    </main>
  </body>
</html>
